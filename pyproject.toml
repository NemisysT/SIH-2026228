[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvtrust"
version = "0.1.0"
description = "Trustworthy Computer Vision Integrity Assurance for multi-contributor pipelines (SIH26228)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — SIH 2026 submission" }

# Runtime is air-gapped. Nothing here contacts a network at run time, and no
# component downloads model weights. See docs/deployment.md.
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pillow>=10.3",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "cryptography>=42",   # Module 3 (Ed25519); manifests are signature-ready now
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

# Module 2 model runtimes. BOTH ARE OPTIONAL: an absent runtime makes the
# corresponding model format unavailable, which the pipeline reports as
# NOT_ASSESSED with a reason naming the missing package. It never becomes a
# crash, and it never becomes a silent pass.
#
# Installing these needs a package index; RUNTIME still touches no network.
# For an air-gapped deployment, vendor the wheels and install from a local
# directory (see docs/deployment.md).
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]

# PyTorch serves two purposes: the optional CNN feature backend (Module 1) and
# the gradient-bearing model pathway (Module 2), which is what makes Neural
# Cleanse trigger reconstruction possible at all. Pretrained weights are never
# downloaded; they must be vendored and referenced by path.
torch = ["torch>=2.2", "torchvision>=0.17"]

# Everything needed to exercise Module 2 end to end, including the model
# attack lab, which trains its own small networks from seeds.
models = ["onnx>=1.16", "onnxruntime>=1.18", "torch>=2.2"]

[project.scripts]
cvtrust = "cvtrust.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that generate a full corpus or train models and run a whole pipeline",
    "adversarial: tests that attempt to evade a detector",
]
